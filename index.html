<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dew Shop</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0e0d;
            --panel-dark: #0d1613;
            --gradient-top: #1a2e2a;
            --accent: #4CAF50;
            --accent-hover: #66bb6a;
            --accent-light: rgba(76,175,80,0.15);
            --muted: #9e9e9e;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            background: linear-gradient(180deg, var(--gradient-top), var(--panel-dark));
            height: 100vh;
            position: fixed;
            width: 80px;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0;
            border-right: 1px solid var(--accent-light);
            z-index: 1000;
        }

        .sidebar .icon {
            width: 50px;
            height: 50px;
            background: var(--accent-light);
            border-radius: 10px;
            margin: 0.6rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sidebar .icon:hover,
        .sidebar .icon.active {
            background-color: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }

        /* Main area */
        main {
            margin-left: 80px;
            padding: 2rem;
            background: var(--panel-dark);
            min-height: 100vh;
        }

        .category-btn {
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            background: transparent;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }

        .category-btn:hover, .category-btn.active {
            background-color: var(--accent);
            color: #fff;
        }

        .product-card {
            background: linear-gradient(145deg, var(--gradient-top), var(--panel-dark));
            border: 1px solid var(--accent-light);
            color: #fff;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
        }

        .product-price {
            color: var(--accent);
            font-weight: bold;
        }

        /* Offcanvas cart */
        .offcanvas {
            background: linear-gradient(180deg, var(--gradient-top), var(--panel-dark));
            color: #fff;
        }

        .offcanvas-header {
            border-bottom: 1px solid var(--accent-light);
        }

        .offcanvas-body {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .btn-accent {
            background: var(--accent);
            color: #fff;
            border: none;
            font-weight: 600;
        }

        .btn-accent:hover {
            background: var(--accent-hover);
        }

        .cart-item {
            background: var(--accent-light);
            border-radius: 10px;
            padding: 0.8rem;
        }

        .cart-item .price {
            color: var(--accent);
            font-weight: 600;
        }

        .cart-footer {
            border-top: 1px solid var(--accent-light);
            padding-top: 1rem;
        }

        .search-input {
            max-width: 300px;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="icon active" title="Dashboard">🏠</div>
    <div class="icon" title="Products">📦</div>
    <div class="icon" title="Orders">📋</div>
    <div class="icon" title="Customers">👥</div>
    <div class="icon" title="Reports">📊</div>
    <div class="icon" title="Settings">⚙️</div>
</div>

<!-- Main content -->
<main>
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="mb-0">Dew Shop Dashboard</h2>
        <input type="text" id="searchBar" class="form-control search-input" placeholder="Search product...">
        <button class="btn btn-accent" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">🛒 Cart</button>
    </div>

    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button class="category-btn active">All</button>
        <button class="category-btn">Watches</button>
        <button class="category-btn">Shoes</button>
        <button class="category-btn">Clothing</button>
        <button class="category-btn">Accessories</button>
    </div>

    <div class="row g-3" id="productList">
        <div class="col-md-3">
            <div class="card product-card text-center p-3" data-name="Silver Watch">
                <div class="fs-1 mb-2">⌚</div>
                <h5>Silver Watch</h5>
                <p class="product-price">Rs. 4000.00</p>
                <button class="btn btn-sm btn-accent add-cart">Add to Cart</button>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card product-card text-center p-3" data-name="Red Maxi">
                <div class="fs-1 mb-2">👗</div>
                <h5>Red Maxi</h5>
                <p class="product-price">Rs. 3200.00</p>
                <button class="btn btn-sm btn-accent add-cart">Add to Cart</button>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card product-card text-center p-3" data-name="Nike Air">
                <div class="fs-1 mb-2">👟</div>
                <h5>Nike Air</h5>
                <p class="product-price">Rs. 8500.00</p>
                <button class="btn btn-sm btn-accent add-cart">Add to Cart</button>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card product-card text-center p-3" data-name="Leather Bag">
                <div class="fs-1 mb-2">👜</div>
                <h5>Leather Bag</h5>
                <p class="product-price">Rs. 7200.00</p>
                <button class="btn btn-sm btn-accent add-cart">Add to Cart</button>
            </div>
        </div>
    </div>
</main>

<!-- Cart Offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartPanel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Order Summary</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div id="cartItems"></div>
    </div>
    <div class="cart-footer p-3">
        <div class="d-flex justify-content-between mb-2">
            <span>Total:</span>
            <span id="totalValue">0.00</span>
        </div>
        <button class="btn btn-accent w-100">Checkout</button>
    </div>
</div>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const cartItems = document.getElementById('cartItems');
    const totalValue = document.getElementById('totalValue');

    // Add to Cart
    document.querySelectorAll('.add-cart').forEach(btn => {
        btn.addEventListener('click', e => {
            const card = e.target.closest('.product-card');
            const name = card.querySelector('h5').textContent;
            const price = parseFloat(card.querySelector('.product-price').textContent.replace('Rs. ', ''));
            addToCart(name, price);
        });
    });

    function addToCart(name, price) {
        const existing = Array.from(cartItems.children).find(item => item.querySelector('.name').textContent === name);
        if (existing) {
            const qtyDisplay = existing.querySelector('.qty');
            qtyDisplay.textContent = parseInt(qtyDisplay.textContent) + 1;
        } else {
            const div = document.createElement('div');
            div.className = 'cart-item mb-3';
            div.innerHTML = `
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="name fw-bold">${name}</div>
              <div class="price">Rs. ${price.toFixed(2)}</div>
              <div class="mt-1">
                <button class="btn btn-sm btn-accent minus">-</button>
                <span class="qty px-2">1</span>
                <button class="btn btn-sm btn-accent plus">+</button>
              </div>
            </div>
            <button class="btn btn-danger btn-sm remove">×</button>
          </div>
        `;
            cartItems.appendChild(div);
        }
        updateTotal();
        setupCartHandlers();
    }

    function updateTotal() {
        let total = 0;
        document.querySelectorAll('.cart-item').forEach(item => {
            const price = parseFloat(item.querySelector('.price').textContent.replace('Rs. ', ''));
            const qty = parseInt(item.querySelector('.qty').textContent);
            total += price * qty;
        });
        totalValue.textContent = total.toFixed(2);
    }

    function setupCartHandlers() {
        document.querySelectorAll('.plus').forEach(btn => {
            btn.onclick = () => {
                const qty = btn.parentElement.querySelector('.qty');
                qty.textContent = parseInt(qty.textContent) + 1;
                updateTotal();
            };
        });
        document.querySelectorAll('.minus').forEach(btn => {
            btn.onclick = () => {
                const qty = btn.parentElement.querySelector('.qty');
                let val = parseInt(qty.textContent);
                if (val > 1) qty.textContent = val - 1;
                updateTotal();
            };
        });
        document.querySelectorAll('.remove').forEach(btn => {
            btn.onclick = () => {
                btn.closest('.cart-item').remove();
                updateTotal();
            };
        });
    }

    // Search bar filter
    document.getElementById('searchBar').addEventListener('keyup', function() {
        const searchTerm = this.value.toLowerCase();
        document.querySelectorAll('#productList .product-card').forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            card.parentElement.style.display = name.includes(searchTerm) ? 'block' : 'none';
        });
    });
</script>
</body>
</html>
